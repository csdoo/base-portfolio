<main class="page-main">
<p class="page-kicker">contato</p>
<h1 class="page-title">VAMOS<br>CONVERSAR?</h1>
<p class="page-lead">Tem um projeto, uma ideia ou quer trocar uma conversa? Me escreva.</p>
<form class="contact-form" id="contact-form">
<label>Seu nome<input type="text" name="name" autocomplete="name" required></label>
<label>Seu e-mail<input type="email" name="email" autocomplete="email" required></label>
<label>Assunto<input type="text" name="subject" required></label>
<label>Mensagem<textarea name="message" required></textarea></label>
<button type="submit">enviar mensagem ↗</button>
<p id="form-status" role="status">O envio será ativado assim que eu configurar o endereço de recebimento.</p>
</form>
</main>
